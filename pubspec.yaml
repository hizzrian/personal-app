name: personal_app
description: Personal app with Notes, Job Tracker, and QR Code features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  image_picker: ^1.0.4
  mobile_scanner: ^6.0.0
  share_plus: ^10.0.0
  uuid: ^4.2.1
  shared_preferences: ^2.2.0
  flutter_quill: ^11.0.0
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/
